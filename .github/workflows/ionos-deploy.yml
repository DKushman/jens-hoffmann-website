name: Deploy IONOS (kiezfueralle.berlin)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ionos
  cancel-in-progress: false

jobs:
  sftp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy marker
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_ID}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > deploy-version.txt

      - name: Upload via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: access-5021112032.webspace-host.com
          username: su1205313
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          protocol: sftp
          port: 22
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.github/**
            **/api/_config.php
            **/.DS_Store